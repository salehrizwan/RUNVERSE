    <meta charset="UTF-8" />
    <script>
      (function() {
        try {
          let _currentFetch = window.fetch ? window.fetch.bind(window) : undefined;
          const descriptor = {
            get: function() {
              return _currentFetch;
            },
            set: function(fn) {
              _currentFetch = fn;
            },
            configurable: true,
            enumerable: true
          };
          try {
            Object.defineProperty(window, 'fetch', descriptor);
          } catch (e1) {
            try {
              Object.defineProperty(Window.prototype, 'fetch', descriptor);
            } catch (e2) {}
          }
        } catch (_) {}
      })();
    </script>
